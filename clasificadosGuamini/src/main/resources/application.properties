spring.application.name=clasificadosGuamini

# Configuración de la conexión a la Base de Datos 
spring.datasource.url=jdbc:mysql://localhost:3306/clasificados_guamini?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678

# Configuración de Hibernate / JPA para que cree/actualice las tablas automáticamente
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update